name: LearningX Northflank Container Build

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/northflank-container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect Python container (no publish)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deep_runtime: [0, 1]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: NIT_DEEP_RUNTIME=${{ matrix.deep_runtime }}
          push: false
          load: true
          tags: learningx-northflank:test
      - name: Validate non-root runtime and bundled NIT engine
        run: |
          docker run --rm --entrypoint python learningx-northflank:test -c '
          import os
          from pathlib import Path
          assert os.getuid() != 0
          assert os.getenv("NIT_HOSTED_RUNTIME") == "1"
          assert Path("/app/nit_engine/scripts/ingest.py").is_file()
          assert Path("/app/nit_engine/scripts/verified_coaching.py").is_file()
          assert Path("/app/learningx/northflank_worker.py").is_file()
          print("Northflank image structural check passed")
          '
      - name: Validate PPTX preview in an isolated worker container
        if: matrix.deep_runtime == 0
        run: |
          docker run --rm -i --memory 512m --entrypoint python learningx-northflank:test - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import pymupdf
          from pptx import Presentation
          from learningx.pptx_preview import generate_preview
          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              source = root / "deck.pptx"
              deck = Presentation()
              for number in range(1, 4):
                  slide = deck.slides.add_slide(deck.slide_layouts[5])
                  slide.shapes.title.text = f"Slide {number}"
                  if number == 2:
                      slide._element.set("show", "0")
              deck.save(source)
              assert generate_preview(source, root, 3)
              with pymupdf.open(root / "live-preview.pdf") as pdf:
                  assert len(pdf) == 3
                  assert "Slide 3" in pdf[2].get_text()
          PY
      - name: Verify missing production secrets fail closed
        run: |
          set +e
          docker run --rm --entrypoint python learningx-northflank:test -m learningx.northflank_worker
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
      - name: Validate optional OCR and Vision dependencies
        if: matrix.deep_runtime == 1
        run: |
          docker run --rm --entrypoint python learningx-northflank:test -c '
          import shutil, subprocess
          from google import genai
          assert shutil.which("libreoffice")
          langs = subprocess.check_output(["tesseract", "--list-langs"], text=True)
          assert "kor" in langs and "eng" in langs
          print("Optional Korean OCR and Vision dependencies available")
          '
