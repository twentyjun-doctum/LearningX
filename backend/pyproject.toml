[project]
name = "learningx-backend"
version = "0.1.0"
description = "LearningX faculty-approved lesson coaching API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
  "PyMuPDF>=1.24,<2",
  "python-pptx>=1.0,<2",
  "pypdf>=5,<7",
  "pydantic>=2,<3",
  "boto3>=1.35,<2",
  "vercel-queue==0.10.0",
]

[tool.uv]
package = false

[[tool.vercel.subscribers]]
entrypoint = "learningx.queue_subscriber"
